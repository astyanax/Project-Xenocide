name: Build & Test

on:
  push:
    branches: [main, master, trunk]
  pull_request:
    branches: [main, master, trunk]

env:
  SOLUTION: Xenocide.sln
  PROJECT: src/Xenocide.MonoGame/Xenocide.MonoGame.csproj
  DOTNET_VERSION: '9.0.x'

jobs:
  format:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ github.head_ref || github.ref_name }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install MonoGame templates
      run: dotnet new install MonoGame.Templates.CSharp

    - name: Restore
      run: dotnet restore ${{ env.SOLUTION }}

    - name: Auto-fix formatting
      run: dotnet format style ${{ env.SOLUTION }} --verbosity diagnostic

    - name: Commit formatting fixes
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: '[skip ci] style: auto-fix imports ordering and formatting'
        commit_user_name: github-actions[bot]
        commit_user_email: github-actions[bot]@users.noreply.github.com

  build:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 is pinned: the MonoGame install-wine action only maps
        # 24.04 (noble) and 22.04 (jammy) to a WineHQ source, and ubuntu-latest
        # migrates to Ubuntu 26 on 2026-10-19.
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install MonoGame templates
      run: dotnet new install MonoGame.Templates.CSharp

    - name: Restore MGCB tools
      run: dotnet tool restore --tool-manifest src/Xenocide.MonoGame/.config/dotnet-tools.json

    - name: Install Linux fonts (spritefonts use Arial / Courier New)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
        sudo apt-get install -y ttf-mscorefonts-installer

    # Provides Wine + d3dcompiler_47 + .NET in the prefix and exports
    # MGFXC_WINE_PATH so MGCB can compile .fx shaders on Linux.
    - name: Setup Wine for MGFXC shader compilation
      if: runner.os == 'Linux'
      uses: monogame/monogame-actions/install-wine@v1.0.3

    - name: Skip broken FBX models (absolute paths)
      shell: pwsh
      run: |
        $mgcb = 'src/Xenocide.MonoGame/Content.mgcb'
        $content = [IO.File]::ReadAllText($mgcb)
        $content = $content -replace '(?ms)^#begin Content/Models/Characters/Alien/Viper\.FBX.*?(?=\n#begin|\n$)', ''
        $content = $content -replace '(?ms)^#begin Content/Models/Characters/XCorp/FemaleShirt\.FBX.*?(?=\n#begin|\n$)', ''
        $content = $content -replace '(?ms)^#begin Content/Models/Facility/Xnet/Barracks\.FBX.*?(?=\n#begin|\n$)', ''
        [IO.File]::WriteAllText($mgcb, $content)

    - name: Restore
      run: dotnet restore ${{ env.SOLUTION }}

    - name: Build
      run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

    - name: Test
      if: runner.os == 'Windows'
      run: dotnet test ${{ env.SOLUTION }} --configuration Debug --verbosity normal

  publish:
    needs: build
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            os: windows-latest
          - runtime: linux-x64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install MonoGame templates
      run: dotnet new install MonoGame.Templates.CSharp

    - name: Install Linux fonts (spritefonts use Arial / Courier New)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
        sudo apt-get install -y ttf-mscorefonts-installer

    # Provides Wine + d3dcompiler_47 + .NET in the prefix and exports
    # MGFXC_WINE_PATH so MGCB can compile .fx shaders on Linux.
    - name: Setup Wine for MGFXC shader compilation
      if: runner.os == 'Linux'
      uses: monogame/monogame-actions/install-wine@v1.0.3

    - name: Skip broken FBX models (absolute paths)
      shell: pwsh
      run: |
        $mgcb = 'src/Xenocide.MonoGame/Content.mgcb'
        $content = [IO.File]::ReadAllText($mgcb)
        $content = $content -replace '(?ms)^#begin Content/Models/Characters/Alien/Viper\.FBX.*?(?=\n#begin|\n$)', ''
        $content = $content -replace '(?ms)^#begin Content/Models/Characters/XCorp/FemaleShirt\.FBX.*?(?=\n#begin|\n$)', ''
        $content = $content -replace '(?ms)^#begin Content/Models/Facility/Xnet/Barracks\.FBX.*?(?=\n#begin|\n$)', ''
        [IO.File]::WriteAllText($mgcb, $content)

    - name: Restore
      run: dotnet restore ${{ env.SOLUTION }}

    - name: Publish
      run: dotnet publish ${{ env.PROJECT }} --configuration Release --runtime ${{ matrix.runtime }} --self-contained false -o publish/${{ matrix.runtime }}

    - name: Zip artifact
      shell: pwsh
      run: Compress-Archive -Path publish/${{ matrix.runtime }}/* -DestinationPath Xenocide-${{ matrix.runtime }}.zip

    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: Xenocide-${{ matrix.runtime }}
        path: Xenocide-${{ matrix.runtime }}.zip
